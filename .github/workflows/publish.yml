name: Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package to publish
        required: true
        type: choice
        options:
          - '@mnie/types'
          - '@mnie/auth-bitwarden'
          - '@mnie/provider-mnie-server'
          - '@mnie/provider-nissay-401k'
          - '@mnie/provider-mobile-suica'
          - '@mnie/provider-paypay'
          - '@mnie/provider-paypay-bank'
          - '@mnie/provider-paypay-sec'
          - '@mnie/provider-sbi-sec'
          - '@mnie/provider-smbc-direct'
          - '@mnie/provider-vpass'
          - '@mnie/sdk'
          - '@mnie/provider-starbucks-jp'
          - '@mnie/cli'
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ inputs.package }}
  cancel-in-progress: false

env:
  PKG: ${{ inputs.package }}
  BUMP: ${{ inputs.bump }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      - name: Publish package
        id: pub
        run: bun scripts/publish-package.ts "$PKG" "$BUMP"

      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.pub.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "git tag $tag already exists" >&2
            exit 1
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "$tag" -m "$tag"
          git push origin "$tag"
          gh release create "$tag" --verify-tag --generate-notes
